services:
  postgres:
    image: postgres:18
    container_name: samaneh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samaneh
      POSTGRES_USER: samaneh_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env file}
    ports:
      - "5432:5432"
    volumes:
      - samaneh_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samaneh_app -d samaneh"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env file}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      set -eu;
      psql -h postgres -U samaneh_app -d samaneh -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())";
      for migration in /migrations/*.sql; do
        version=$(basename "$migration");
        applied=$(psql -h postgres -U samaneh_app -d samaneh -tAc "SELECT 1 FROM public.schema_migrations WHERE version='$version'");
        if [ "$applied" = "1" ]; then echo "Skipping already applied $version"; continue; fi;
        echo "Applying $version";
        psql -h postgres -U samaneh_app -d samaneh -v ON_ERROR_STOP=1 -f "$migration";
        psql -h postgres -U samaneh_app -d samaneh -v ON_ERROR_STOP=1 -c "INSERT INTO public.schema_migrations(version) VALUES ('$version')";
      done

  api:
    build:
      context: .
      dockerfile: src/Samaneh.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=samaneh;Username=samaneh_app;Password=${POSTGRES_PASSWORD}
      Authentication__SigningKey: ${AUTHENTICATION_SIGNING_KEY:?Set AUTHENTICATION_SIGNING_KEY in your private .env file}
      Authentication__Issuer: samaneh-local
      Authentication__Audience: samaneh-local-web
      Cors__AllowedOrigins__0: http://localhost:8081
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  samaneh_postgres_data:
