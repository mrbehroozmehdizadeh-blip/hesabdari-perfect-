services:
  postgres:
    image: postgres:18
    container_name: samaneh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samaneh
      POSTGRES_USER: samaneh_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - samaneh_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samaneh_app -d samaneh"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  samaneh_postgres_data:
