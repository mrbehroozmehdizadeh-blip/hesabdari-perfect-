name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Samaneh.sln
      - name: Build
        run: dotnet build Samaneh.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Samaneh.sln --configuration Release --no-build
