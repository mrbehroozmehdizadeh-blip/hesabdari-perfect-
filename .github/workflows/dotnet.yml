name: .NET CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: samaneh_ci
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: samaneh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samaneh_ci -d samaneh_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Samaneh.sln
      - name: Build
        run: dotnet build Samaneh.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Samaneh.sln --configuration Release --no-build
      - name: Build API container image
        run: docker build -f src/Samaneh.Api/Dockerfile -t samaneh-api:ci .
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
          AUTHENTICATION_SIGNING_KEY: ci-only-signing-key-with-at-least-32-bytes
        run: docker compose config --quiet
      - name: Run full Docker Compose stack and smoke tests
        env:
          POSTGRES_PASSWORD: ci-test-password
          AUTHENTICATION_SIGNING_KEY: ci-only-signing-key-with-at-least-32-bytes
          POSTGRES_HOST_PORT: 55432
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/health/db; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/health/db
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8081/ > /dev/null
          curl --fail --silent http://localhost:8081/health/db
      - name: Stop Docker Compose stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-test-password
          AUTHENTICATION_SIGNING_KEY: ci-only-signing-key-with-at-least-32-bytes
          POSTGRES_HOST_PORT: 55432
        run: docker compose down --volumes
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database migrations against PostgreSQL 18
        env:
          PGPASSWORD: ci-test-password
        run: |
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0001_financial_core.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0002_company_memberships.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0003_journal_line_company_integrity.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0004_journal_idempotency_fingerprint.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0005_journal_approval_lifecycle.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0006_general_ledger.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0007_ledger_provenance_guards.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0008_reversal_and_poster_controls.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0009_fiscal_period_controls.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0010_year_end_closing_guards.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0011_opening_carry_forward_provenance.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0012_carry_forward_period_guards.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0013_role_permission_catalog.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0014_membership_role_integrity.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0015_membership_change_governance.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0016_membership_review_separation.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0017_membership_self_request_guard.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/migrations/0018_membership_review_reason.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/rbac_invariants.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/membership_role_integrity.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/membership_change_governance.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/membership_review_separation.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/membership_review_audit_invariants.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/ledger_invariants.sql
          psql -h localhost -U samaneh_ci -d samaneh_ci -v ON_ERROR_STOP=1 -f database/tests/fiscal_period_controls.sql
